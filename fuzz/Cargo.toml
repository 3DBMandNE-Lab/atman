# cargo-fuzz project for atman's untrusted-input readers.
# Requires a nightly toolchain: `cargo +nightly fuzz run <target>`.
# This is its own workspace so the stable `cargo build --workspace` ignores it.
[package]
name = "atman-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.atman]
path = "../crates/atman"

[[bin]]
name = "read_measurements"
path = "fuzz_targets/read_measurements.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_samples"
path = "fuzz_targets/read_samples.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_proteins"
path = "fuzz_targets/read_proteins.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
