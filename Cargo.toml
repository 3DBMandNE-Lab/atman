[workspace]
members = ["crates/atman-core", "crates/atman"]
# `fuzz/` is a cargo-fuzz project requiring a nightly toolchain + libfuzzer; it
# is its own workspace and excluded from the stable `--workspace` build/test.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Kevin Joseph"]
repository = "https://github.com/kevinj24fr/atman"
homepage = "https://github.com/kevinj24fr/atman"
readme = "README.md"
keywords = ["proteomics", "mass-spectrometry", "bioinformatics", "olink", "cli"]
categories = ["command-line-utilities", "science"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
statrs = "0.17"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
proptest = "1"
regex = "1"
